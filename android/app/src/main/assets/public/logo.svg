<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle for App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="220" fill="url(#auraGrad)" />
  
  <!-- Outer Sacred Geometry Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />
  
  <!-- 8 Lotus Petal Accents -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.5">
    <circle cx="256" cy="72" r="6" fill="url(#goldGrad)" />
    <circle cx="256" cy="440" r="6" fill="url(#goldGrad)" />
    <circle cx="72" cy="256" r="6" fill="url(#goldGrad)" />
    <circle cx="440" cy="256" r="6" fill="url(#goldGrad)" />
    <circle cx="126" cy="126" r="4" fill="url(#goldGrad)" />
    <circle cx="386" cy="126" r="4" fill="url(#goldGrad)" />
    <circle cx="126" cy="386" r="4" fill="url(#goldGrad)" />
    <circle cx="386" cy="386" r="4" fill="url(#goldGrad)" />
  </g>

  <!-- Stylized Manuscript Palm Leaf & Quill Motif -->
  <path d="M160 380 C 220 370, 320 340, 370 270 C 390 240, 395 210, 385 180 C 375 150, 345 135, 320 145 C 295 155, 290 180, 275 210 C 255 250, 210 320, 160 380 Z" 
        fill="url(#goldGrad)" opacity="0.18" />

  <!-- Central Classical Devanagari 'क' (Kavya) Glyph -->
  <text x="256" y="325" 
        font-family="'Noto Serif Devanagari', 'Cormorant Garamond', serif" 
        font-size="220" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        filter="url(#glow)">क</text>

  <!-- Quill tip flourish -->
  <path d="M190 350 L 160 380 L 195 365" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
